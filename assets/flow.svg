<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 600" width="320" height="600" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="blep flow: pick a device, track it, found it">
  <defs>
    <clipPath id="screen"><rect x="52" y="44" width="216" height="512" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect x="52" y="44" width="216" height="512" fill="#EEF2F6"/>

    <!-- ░░ Scene 1 — pick a device ░░ -->
    <g>
      <animate attributeName="opacity" dur="13s" repeatCount="indefinite"
        keyTimes="0;0.27;0.31;0.96;1" values="1;1;0;0;1"/>

      <text x="68" y="92" font-size="28" font-weight="700" fill="#27313B" letter-spacing="-1">blep</text>
      <text x="68" y="112" font-size="10.5" fill="#27313B" opacity="0.55">Tap a device to track it</text>
      <rect x="196" y="78" width="52" height="20" rx="10" fill="#27313B" opacity="0.07"/>
      <text x="222" y="92" font-size="9" font-weight="600" text-anchor="middle" fill="#27313B" opacity="0.6">3 nearby</text>
      <text x="70" y="134" font-size="9" font-weight="600" letter-spacing="1.2" fill="#27313B" opacity="0.4">NEARBY</text>

      <!-- card: Earbuds (connected) -->
      <g>
        <rect x="68" y="148" width="184" height="54" rx="16" fill="#27313B" opacity="0.05"/>
        <rect x="68" y="146" width="184" height="54" rx="16" fill="#FFFFFF"/>
        <circle cx="95" cy="173" r="15" fill="#5F90C3"/>
        <text x="95" y="178" font-size="13" font-weight="700" text-anchor="middle" fill="#F4F5F0">E</text>
        <text x="120" y="170" font-size="14" font-weight="600" fill="#27313B">Earbuds</text>
        <text x="120" y="186" font-size="10" font-weight="600" fill="#5F90C3">● Connected</text>
        <g fill="#5F90C3"><rect x="214" y="179" width="5" height="7" rx="2"/><rect x="221" y="176" width="5" height="10" rx="2"/><rect x="228" y="173" width="5" height="13" rx="2"/><rect x="235" y="170" width="5" height="16" rx="2"/></g>
      </g>

      <!-- card: Keys Tag -->
      <g>
        <rect x="68" y="210" width="184" height="54" rx="16" fill="#27313B" opacity="0.05"/>
        <rect x="68" y="208" width="184" height="54" rx="16" fill="#FFFFFF"/>
        <circle cx="95" cy="235" r="15" fill="#5F90C3" fill-opacity="0.12"/>
        <text x="95" y="240" font-size="13" font-weight="700" text-anchor="middle" fill="#5F90C3">K</text>
        <text x="120" y="232" font-size="14" font-weight="600" fill="#27313B">Keys Tag</text>
        <text x="120" y="248" font-size="10" fill="#27313B" opacity="0.45">−67 dBm</text>
        <g><rect x="214" y="241" width="5" height="7" rx="2" fill="#5F90C3"/><rect x="221" y="238" width="5" height="10" rx="2" fill="#5F90C3"/><rect x="228" y="235" width="5" height="13" rx="2" fill="#5F90C3"/><rect x="235" y="232" width="5" height="16" rx="2" fill="#27313B" fill-opacity="0.1"/></g>
      </g>

      <!-- card: Speaker -->
      <g>
        <rect x="68" y="272" width="184" height="54" rx="16" fill="#27313B" opacity="0.05"/>
        <rect x="68" y="270" width="184" height="54" rx="16" fill="#FFFFFF"/>
        <circle cx="95" cy="297" r="15" fill="#5F90C3" fill-opacity="0.12"/>
        <text x="95" y="302" font-size="13" font-weight="700" text-anchor="middle" fill="#5F90C3">S</text>
        <text x="120" y="294" font-size="14" font-weight="600" fill="#27313B">Speaker</text>
        <text x="120" y="310" font-size="10" fill="#27313B" opacity="0.45">−78 dBm</text>
        <g><rect x="214" y="303" width="5" height="7" rx="2" fill="#5F90C3"/><rect x="221" y="300" width="5" height="10" rx="2" fill="#5F90C3"/><rect x="228" y="297" width="5" height="13" rx="2" fill="#27313B" fill-opacity="0.1"/><rect x="235" y="294" width="5" height="16" rx="2" fill="#27313B" fill-opacity="0.1"/></g>
      </g>

      <!-- show more pill -->
      <g>
        <rect x="68" y="338" width="184" height="30" rx="15" fill="#5F90C3" fill-opacity="0.1"/>
        <text x="160" y="357" font-size="11" font-weight="600" text-anchor="middle" fill="#5F90C3">+  Show 1 unnamed device</text>
      </g>

      <!-- revealed (ghosted) unnamed device -->
      <g opacity="0">
        <animate attributeName="opacity" dur="13s" repeatCount="indefinite" keyTimes="0;0.17;0.23;1" values="0;0;1;1"/>
        <rect x="68" y="378" width="184" height="46" rx="16" fill="#FFFFFF" stroke="#27313B" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="5 4"/>
        <circle cx="93" cy="401" r="13" fill="#27313B" fill-opacity="0.06"/>
        <text x="93" y="406" font-size="12" font-weight="700" text-anchor="middle" fill="#27313B" opacity="0.4">?</text>
        <text x="116" y="406" font-size="13" font-weight="600" fill="#27313B" opacity="0.5">Unnamed device</text>
      </g>
    </g>

    <!-- ░░ Scene 2 — track (warm / cold) ░░ -->
    <g opacity="0">
      <animate attributeName="opacity" dur="13s" repeatCount="indefinite"
        keyTimes="0;0.27;0.31;0.69;0.73;1" values="0;0;1;1;0;0"/>

      <rect x="52" y="44" width="216" height="512">
        <animate attributeName="fill" dur="13s" repeatCount="indefinite"
          keyTimes="0;0.31;0.46;0.58;0.66;1"
          values="#7FA8D4;#7FA8D4;#8FD0CB;#AEDFA6;#F4D58D;#F4D58D"/>
      </rect>

      <text x="160" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#27313B" opacity="0.7">Earbuds</text>

      <!-- flexible arrow: the body itself curls ("turn") then uncurls ("go") -->
      <g transform="translate(160 268)">
        <animateTransform attributeName="transform" type="translate" additive="sum" dur="2.8s" repeatCount="indefinite"
          calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
          values="0 0;0 -5;0 0;0 4;0 0"/>
        <g>
          <animateTransform attributeName="transform" type="scale" dur="2.4s" repeatCount="indefinite"
            calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" values="0.95;1.08;0.95"/>
          <path fill="none" stroke="#27313B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
            d="M-49.7 60.0 L-49.7 54.5 L-49.3 49.0 L-48.7 43.5 L-47.7 38.0 L-46.4 32.7 L-44.7 27.4 L-42.8 22.2 L-40.5 17.2 L-38.0 12.3 L-35.2 7.5 L-32.0 3.0 L-28.6 -1.4 L-25.0 -5.5 L-21.1 -9.5 L-17.0 -13.2 L-12.7 -16.6 L-8.1 -19.8 L-3.4 -22.7 L1.4 -25.3 L6.5 -27.6 L11.6 -29.6 L16.9 -31.3 L22.2 -32.6 L27.6 -33.7 L33.1 -34.4 L38.6 -34.8 L44.2 -34.8 L49.7 -34.6 M13.2 -60.0 L49.7 -34.6 L8.6 -17.7">
            <animate attributeName="d" dur="5s" repeatCount="indefinite"
              calcMode="spline" keyTimes="0;0.32;0.5;0.82;1"
              keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
              values="M-49.7 60.0 L-49.7 54.5 L-49.3 49.0 L-48.7 43.5 L-47.7 38.0 L-46.4 32.7 L-44.7 27.4 L-42.8 22.2 L-40.5 17.2 L-38.0 12.3 L-35.2 7.5 L-32.0 3.0 L-28.6 -1.4 L-25.0 -5.5 L-21.1 -9.5 L-17.0 -13.2 L-12.7 -16.6 L-8.1 -19.8 L-3.4 -22.7 L1.4 -25.3 L6.5 -27.6 L11.6 -29.6 L16.9 -31.3 L22.2 -32.6 L27.6 -33.7 L33.1 -34.4 L38.6 -34.8 L44.2 -34.8 L49.7 -34.6 M13.2 -60.0 L49.7 -34.6 L8.6 -17.7;
                      M-49.7 60.0 L-49.7 54.5 L-49.3 49.0 L-48.7 43.5 L-47.7 38.0 L-46.4 32.7 L-44.7 27.4 L-42.8 22.2 L-40.5 17.2 L-38.0 12.3 L-35.2 7.5 L-32.0 3.0 L-28.6 -1.4 L-25.0 -5.5 L-21.1 -9.5 L-17.0 -13.2 L-12.7 -16.6 L-8.1 -19.8 L-3.4 -22.7 L1.4 -25.3 L6.5 -27.6 L11.6 -29.6 L16.9 -31.3 L22.2 -32.6 L27.6 -33.7 L33.1 -34.4 L38.6 -34.8 L44.2 -34.8 L49.7 -34.6 M13.2 -60.0 L49.7 -34.6 L8.6 -17.7;
                      M-0.0 60.0 L-0.0 55.7 L-0.0 51.4 L-0.0 47.1 L-0.0 42.9 L-0.0 38.6 L-0.0 34.3 L-0.0 30.0 L-0.0 25.7 L-0.0 21.4 L-0.0 17.1 L-0.0 12.9 L-0.0 8.6 L-0.0 4.3 L-0.0 0.0 L-0.0 -4.3 L-0.0 -8.6 L-0.0 -12.9 L-0.0 -17.1 L-0.0 -21.4 L-0.0 -25.7 L-0.0 -30.0 L-0.0 -34.3 L-0.0 -38.6 L-0.0 -42.9 L-0.0 -47.1 L-0.0 -51.4 L-0.0 -55.7 L-0.0 -60.0 M-16.5 -29.8 L-0.0 -60.0 L16.5 -29.8;
                      M-0.0 60.0 L-0.0 55.7 L-0.0 51.4 L-0.0 47.1 L-0.0 42.9 L-0.0 38.6 L-0.0 34.3 L-0.0 30.0 L-0.0 25.7 L-0.0 21.4 L-0.0 17.1 L-0.0 12.9 L-0.0 8.6 L-0.0 4.3 L-0.0 0.0 L-0.0 -4.3 L-0.0 -8.6 L-0.0 -12.9 L-0.0 -17.1 L-0.0 -21.4 L-0.0 -25.7 L-0.0 -30.0 L-0.0 -34.3 L-0.0 -38.6 L-0.0 -42.9 L-0.0 -47.1 L-0.0 -51.4 L-0.0 -55.7 L-0.0 -60.0 M-16.5 -29.8 L-0.0 -60.0 L16.5 -29.8;
                      M-49.7 60.0 L-49.7 54.5 L-49.3 49.0 L-48.7 43.5 L-47.7 38.0 L-46.4 32.7 L-44.7 27.4 L-42.8 22.2 L-40.5 17.2 L-38.0 12.3 L-35.2 7.5 L-32.0 3.0 L-28.6 -1.4 L-25.0 -5.5 L-21.1 -9.5 L-17.0 -13.2 L-12.7 -16.6 L-8.1 -19.8 L-3.4 -22.7 L1.4 -25.3 L6.5 -27.6 L11.6 -29.6 L16.9 -31.3 L22.2 -32.6 L27.6 -33.7 L33.1 -34.4 L38.6 -34.8 L44.2 -34.8 L49.7 -34.6 M13.2 -60.0 L49.7 -34.6 L8.6 -17.7"/>
          </path>
        </g>
      </g>

      <text x="160" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#27313B">
        Turn slowly
        <animate attributeName="opacity" dur="13s" repeatCount="indefinite" keyTimes="0;0.46;0.5;1" values="1;1;0;0"/>
      </text>
      <text x="160" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#27313B" opacity="0">
        Keep going
        <animate attributeName="opacity" dur="13s" repeatCount="indefinite" keyTimes="0;0.5;0.54;1" values="0;0;1;1"/>
      </text>
    </g>

    <!-- ░░ Scene 3 — found it ░░ -->
    <g opacity="0">
      <animate attributeName="opacity" dur="13s" repeatCount="indefinite"
        keyTimes="0;0.69;0.73;0.96;1" values="0;0;1;1;0"/>
      <rect x="52" y="44" width="216" height="512" fill="#F4D58D"/>
      <circle cx="160" cy="248" r="52" fill="#5F90C3"/>
      <path d="M136 248 l16 16 l32 -34" fill="none" stroke="#F4F5F0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-dasharray" dur="13s" repeatCount="indefinite" keyTimes="0;0.73;0.8;1" values="0 90;0 90;90 0;90 0"/>
      </path>
      <text x="160" y="348" text-anchor="middle" font-size="30" font-weight="700" fill="#27313B" letter-spacing="-1">Finished</text>
      <text x="160" y="376" text-anchor="middle" font-size="13" fill="#27313B" opacity="0.7">Congratulations!</text>
    </g>
  </g>

  <!-- Phone frame -->
  <rect x="40" y="20" width="240" height="560" rx="40" fill="none" stroke="#27313B" stroke-width="4"/>
  <rect x="52" y="44" width="216" height="512" rx="24" fill="none" stroke="#27313B" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="132" y="30" width="56" height="8" rx="4" fill="#27313B"/>
</svg>
