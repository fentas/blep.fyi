<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 600" width="320" height="600" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="blep flow: pick a device, track it, success">
  <defs>
    <clipPath id="screen"><rect x="52" y="44" width="216" height="512" rx="24"/></clipPath>
  </defs>

  <!-- Screen content (clipped to the phone screen) -->
  <g clip-path="url(#screen)">
    <rect x="52" y="44" width="216" height="512" fill="#EEF2F6"/>

    <!-- ░░ Scene 1 — pick a device ░░ -->
    <g>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.292;0.333;0.958;1" values="1;1;0;0;1"/>
      <text x="72" y="96" font-size="30" font-weight="700" fill="#27313B" letter-spacing="-1">blep</text>
      <text x="72" y="118" font-size="11" fill="#27313B" opacity="0.55">Tap a device to track it</text>

      <!-- connected, highlighted -->
      <rect x="72" y="138" width="176" height="56" rx="16" fill="#F4F5F0" stroke="#5F90C3" stroke-width="2"/>
      <text x="88" y="166" font-size="15" font-weight="600" fill="#27313B">Earbuds</text>
      <text x="88" y="184" font-size="10" font-weight="600" fill="#5F90C3">Connected</text>

      <rect x="72" y="204" width="176" height="56" rx="16" fill="#F4F5F0" stroke="#27313B" stroke-opacity="0.07" stroke-width="2"/>
      <text x="88" y="238" font-size="15" font-weight="600" fill="#27313B">Keys Tag</text>

      <rect x="72" y="270" width="176" height="56" rx="16" fill="#F4F5F0" stroke="#27313B" stroke-opacity="0.07" stroke-width="2"/>
      <text x="88" y="304" font-size="15" font-weight="600" fill="#27313B">Speaker</text>

      <!-- tap ripple on the first row -->
      <circle cx="225" cy="166" r="6" fill="#5F90C3">
        <animate attributeName="r" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.18;0.24;0.30;1" values="6;6;22;26;26"/>
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.18;0.24;0.30;0.333;1" values="0;0;0.5;0;0;0"/>
      </circle>
    </g>

    <!-- ░░ Scene 2 — track (warm/cold) ░░ -->
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.292;0.333;0.708;0.75;1" values="0;0;1;1;0;0"/>

      <!-- background shifts cool -> warm -->
      <rect x="52" y="44" width="216" height="512">
        <animate attributeName="fill" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.333;0.5;0.62;0.7;1"
          values="#7FA8D4;#7FA8D4;#8FD0CB;#AEDFA6;#F4D58D;#F4D58D"/>
      </rect>

      <text x="160" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#27313B" opacity="0.7">Earbuds</text>

      <!-- guidance arrow: rotates to aim, then grows as it gets warmer -->
      <g transform="translate(160 270)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="12s" repeatCount="indefinite"
            keyTimes="0;0.333;0.42;0.5;0.58;0.7;1" values="0;28;28;-14;0;0;0"/>
          <g>
            <animateTransform attributeName="transform" type="scale" dur="12s" repeatCount="indefinite"
              keyTimes="0;0.333;0.7;1" values="0.85;0.85;1.35;1.35"/>
            <path d="M0 64 L0 -40" stroke="#27313B" stroke-width="13" stroke-linecap="round"/>
            <path d="M-36 -8 L0 -44 L36 -8" fill="none" stroke="#27313B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </g>
      </g>

      <!-- guidance copy crossfades -->
      <text x="160" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#27313B">
        Turn slowly
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.46;0.5;1" values="1;1;0;0"/>
      </text>
      <text x="160" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#27313B" opacity="0">
        Keep going
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.5;0.54;1" values="0;0;1;1"/>
      </text>
    </g>

    <!-- ░░ Scene 3 — found it ░░ -->
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.708;0.75;0.958;1" values="0;0;1;1;0"/>
      <rect x="52" y="44" width="216" height="512" fill="#F4D58D"/>
      <circle cx="160" cy="250" r="52" fill="#5F90C3"/>
      <path d="M136 250 l16 16 l32 -34" fill="none" stroke="#F4F5F0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-dasharray" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.75;0.82;1" values="0 90;0 90;90 0;90 0"/>
      </path>
      <text x="160" y="350" text-anchor="middle" font-size="30" font-weight="700" fill="#27313B" letter-spacing="-1">Finished</text>
      <text x="160" y="378" text-anchor="middle" font-size="13" fill="#27313B" opacity="0.7">Congratulations!</text>
    </g>
  </g>

  <!-- Phone frame on top -->
  <rect x="40" y="20" width="240" height="560" rx="40" fill="none" stroke="#27313B" stroke-width="4"/>
  <rect x="52" y="44" width="216" height="512" rx="24" fill="none" stroke="#27313B" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="132" y="30" width="56" height="8" rx="4" fill="#27313B"/>
</svg>
