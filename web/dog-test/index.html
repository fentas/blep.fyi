<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>blep — dog animation test &amp; frame editor</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #1b1f24; color: #e7e7e7; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; gap: 18px; }
    .stage { display: grid; gap: 12px; justify-items: center; }
    canvas#c { background: #b6e0a0; border-radius: 20px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
    button { font: inherit; padding: 7px 13px; border-radius: 999px; border: 1px solid #444; background: #2b3037; color: #e7e7e7; cursor: pointer; }
    button.on { background: #5f90c3; border-color: #5f90c3; color: #fff; }
    .meta { font-size: 13px; opacity: .75; font-variant-numeric: tabular-nums; text-align: center; }
    h2 { font-size: 15px; margin: 6px 0; opacity: .85; }
    .frames { display: flex; gap: 8px; flex-wrap: wrap; }
    .card { width: 104px; background: #23272e; border: 2px solid #333; border-radius: 12px; padding: 6px; cursor: grab; user-select: none; }
    .card.bad { border-color: #d98a8a; }
    .card canvas { width: 92px; height: 61px; background: #b6e0a0; border-radius: 6px; display: block; }
    .card .id { font-weight: 600; font-size: 12px; margin-top: 4px; }
    .card .sub { font-size: 11px; opacity: .65; font-variant-numeric: tabular-nums; }
    .card.drag { opacity: .4; }
    .card.over { border-color: #5f90c3; }
    .seam { font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <canvas id="c" width="320" height="212"></canvas>
      <div class="row" id="clips"></div>
      <div class="row">
        <button id="auto">▶ auto-cycle</button>
        <label style="font-size:13px;opacity:.8">speed <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1" /></label>
      </div>
      <div class="meta" id="meta">loading…</div>
    </div>

    <div>
      <div class="row" style="justify-content:space-between">
        <h2 id="editTitle">frames</h2>
        <div class="row">
          <span class="seam" id="seam"></span>
          <button id="resetOrder">reset</button>
          <button id="copyOrder">copy frames JSON</button>
        </div>
      </div>
      <div class="frames" id="frames"></div>
      <div class="meta" style="text-align:left;margin-top:8px">
        Drag cards to reorder. Each shows the source <b>gemini id</b>, <b>drift</b> (px the centre-of-mass was shifted),
        and <b>Δnext</b> (pose change to the next frame — red = likely jump). “copy frames JSON” → paste into
        <code>web/dog-frames.json</code> → <code>clips.&lt;name&gt;.frames</code>, then re-run <code>npm run gen:dog</code>.
      </div>
    </div>
  </div>

  <script src="anim.js"></script>
  <script>
    const D = window.DOG, [CW, CH] = D.cell, AREA = D.maskArea
    const img = new Image(); img.src = 'dog_sheet.png'
    const cv = document.getElementById('c'), ctx = cv.getContext('2d')
    let speed = 1; document.getElementById('speed').oninput = (e) => speed = +e.target.value

    // ── playback (mirrors the app) ──────────────────────────────────────────
    let shown = 2, startFrame = 0, t0 = performance.now(), fromIdx = -1, fromFrame = 0, fadeStart = -1e9
    const clipFrame = (idx, sf, ms) => {
      const c = D.clips[idx], step = Math.floor(ms / 1000 * c.fps * speed)
      if (c.loop) { const d = c.reverse ? -1 : 1; return (((sf + d * step) % c.frames) + c.frames) % c.frames }
      const s = Math.min(step, c.frames - 1); return c.reverse ? c.frames - 1 - s : s
    }
    const drawCell = (g, col, row, dw, dh) => g.drawImage(img, col * CW, row * CH, CW, CH, 0, 0, dw, dh)
    function switchTo(idx) {
      if (idx === shown) { renderEditor(); return }
      const now = performance.now()
      fromIdx = shown; fromFrame = clipFrame(shown, startFrame, now - t0)
      startFrame = (D.transition[shown]?.[idx]?.[fromFrame] ?? 0)
      shown = idx; t0 = now; fadeStart = now
      for (const b of document.querySelectorAll('#clips button')) b.classList.toggle('on', +b.dataset.i === idx)
      renderEditor()
    }
    function loop() {
      const now = performance.now()
      ctx.clearRect(0, 0, cv.width, cv.height)
      const fade = Math.min(1, (now - fadeStart) / 300)
      if (fade < 1 && fromIdx >= 0) { ctx.globalAlpha = 1 - fade; drawCell(ctx, D.clips[fromIdx].seq[fromFrame].col, D.clips[fromIdx].row, cv.width, cv.height) }
      const cf = clipFrame(shown, startFrame, now - t0)
      ctx.globalAlpha = fade; drawCell(ctx, D.clips[shown].seq[cf].col, D.clips[shown].row, cv.width, cv.height); ctx.globalAlpha = 1
      const c = D.clips[shown]
      document.getElementById('meta').textContent = `${c.name}  ${cf}/${c.frames - 1}  ${c.fps}fps${c.loop ? '' : ' one-shot'}${c.reverse ? ' ⟲' : ''}`
      requestAnimationFrame(loop)
    }

    // ── frame editor ────────────────────────────────────────────────────────
    const order = {}            // clip name -> array of seq entries (working order)
    D.clips.forEach((c) => order[c.name] = c.seq.slice())
    const pct = (d) => (100 * d / AREA).toFixed(1) + '%'

    function renderEditor() {
      const c = D.clips[shown], seq = order[c.name]
      document.getElementById('editTitle').textContent = `frames — ${c.name} (${seq.length})`
      const seam = c.diff[seq[seq.length - 1].col][seq[0].col]
      document.getElementById('seam').innerHTML = c.loop ? `loop seam <b style="color:${seam > AREA * .08 ? '#d98a8a' : '#9bd17f'}">${pct(seam)}</b>` : 'one-shot'
      const host = document.getElementById('frames'); host.innerHTML = ''
      seq.forEach((s, k) => {
        const next = seq[(k + 1) % seq.length]
        const dNext = c.diff[s.col][next.col]
        const bad = (c.loop || k < seq.length - 1) && dNext > AREA * 0.10
        const card = document.createElement('div')
        card.className = 'card' + (bad ? ' bad' : ''); card.draggable = true; card.dataset.k = k
        const cvn = document.createElement('canvas'); cvn.width = 92; cvn.height = 61
        drawCellTo(cvn, s.col, c.row)
        card.appendChild(cvn)
        const id = document.createElement('div'); id.className = 'id'; id.textContent = s.id; card.appendChild(id)
        const sub = document.createElement('div'); sub.className = 'sub'
        sub.textContent = `drift ${s.drift[0]},${s.drift[1]} · Δ${pct(dNext)}`; card.appendChild(sub)
        wireDrag(card, c.name); host.appendChild(card)
      })
    }
    function drawCellTo(canvas, col, row) {
      const g = canvas.getContext('2d')
      const dh = canvas.height, dw = canvas.width
      g.clearRect(0, 0, dw, dh); g.drawImage(img, col * CW, row * CH, CW, CH, 0, 0, dw, dh)
    }
    let dragK = -1
    function wireDrag(card, clipName) {
      card.addEventListener('dragstart', () => { dragK = +card.dataset.k; card.classList.add('drag') })
      card.addEventListener('dragend', () => card.classList.remove('drag'))
      card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('over') })
      card.addEventListener('dragleave', () => card.classList.remove('over'))
      card.addEventListener('drop', (e) => {
        e.preventDefault(); card.classList.remove('over')
        const to = +card.dataset.k, arr = order[clipName]
        if (dragK < 0 || dragK === to) return
        const [m] = arr.splice(dragK, 1); arr.splice(to, 0, m)
        renderEditor()
      })
    }
    document.getElementById('resetOrder').onclick = () => { order[D.clips[shown].name] = D.clips[shown].seq.slice(); renderEditor() }
    document.getElementById('copyOrder').onclick = () => {
      const ids = order[D.clips[shown].name].map((s) => s.id)
      navigator.clipboard.writeText(JSON.stringify(ids)).then(() => {
        const b = document.getElementById('copyOrder'); b.textContent = 'copied!'; setTimeout(() => b.textContent = 'copy frames JSON', 1200)
      })
    }

    img.onload = () => {
      const wrap = document.getElementById('clips')
      D.clips.forEach((c, i) => {
        const b = document.createElement('button'); b.textContent = c.name; b.dataset.i = i
        b.classList.toggle('on', i === shown); b.onclick = () => switchTo(i); wrap.appendChild(b)
      })
      renderEditor(); requestAnimationFrame(loop)
    }
    let auto = null
    document.getElementById('auto').onclick = (e) => {
      if (auto) { clearInterval(auto); auto = null; e.target.textContent = '▶ auto-cycle'; return }
      e.target.textContent = '⏸ stop'; auto = setInterval(() => switchTo((shown + 1) % D.clips.length), 2600)
    }
  </script>
</body>
</html>
