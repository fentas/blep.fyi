name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'app/**'

permissions:
  contents: read

jobs:
  core-tests:
    name: Core unit tests (JVM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:jvmTest --stacktrace

  android:
    name: Build Android (phone + wear)
    runs-on: ubuntu-latest # Android SDK is preinstalled on GitHub ubuntu runners
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:assembleDebug :wearApp:assembleDebug --stacktrace

  apple:
    name: Compile Apple targets (iOS + watchOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: >
          ./gradlew
          :core:compileKotlinIosSimulatorArm64
          :core:compileKotlinWatchosSimulatorArm64
          :composeApp:compileKotlinIosSimulatorArm64
          --stacktrace

  swift-apps:
    name: Build Swift apps (iOS + watchOS)
    # Pinned to Xcode 15.4 (iOS 17 SDK). Compose Multiplatform 1.11's framework
    # hard-references an iOS-18 UIKit symbol (UIViewLayoutRegion) when built against
    # the iOS-18 SDK (Xcode 16), which then fails to link below iOS 18. Building the
    # framework against the iOS-17 SDK avoids the reference entirely and keeps the
    # app's iOS-15 deployment floor. Interim until CMP weak-links it (see
    # JetBrains/compose-multiplatform#4821). XcodeGen is pinned to 2.41.0 because
    # newer versions emit an Xcode-16-only project format (objectVersion 77) that
    # Xcode 15.4 can't open.
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install XcodeGen 2.41.0 (emits an Xcode-15-readable project format)
        run: |
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.41.0/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          cd /tmp/xcodegen-dist/xcodegen && sudo ./install.sh
          xcodegen --version
      - name: Build iOS app (compiles Swift + links the KMP framework)
        working-directory: app/iosApp
        run: |
          xcodegen generate
          xcodebuild -project iosApp.xcodeproj -target iosApp \
            -configuration Debug -sdk iphonesimulator -arch arm64 \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build watchOS app (compiles Swift + links the KMP framework)
        working-directory: app/watchApp
        run: |
          xcodegen generate
          xcodebuild -project watchApp.xcodeproj -target watchApp \
            -configuration Debug -sdk watchsimulator -arch arm64 \
            CODE_SIGNING_ALLOWED=NO build
