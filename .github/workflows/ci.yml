name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'app/**'

permissions:
  contents: read

jobs:
  core-tests:
    name: Core unit tests (JVM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:jvmTest --stacktrace

  android:
    name: Build Android (phone + wear)
    runs-on: ubuntu-latest # Android SDK is preinstalled on GitHub ubuntu runners
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:assembleDebug :wearApp:assembleDebug --stacktrace

  apple:
    name: Compile Apple targets (iOS + watchOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: >
          ./gradlew
          :core:compileKotlinIosSimulatorArm64
          :core:compileKotlinWatchosSimulatorArm64
          :composeApp:compileKotlinIosSimulatorArm64
          --stacktrace
