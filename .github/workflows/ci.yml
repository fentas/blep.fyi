name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'app/**'

permissions:
  contents: read

jobs:
  core-tests:
    name: Core unit tests (JVM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:jvmTest --stacktrace

  android:
    name: Build Android (phone + wear)
    runs-on: ubuntu-latest # Android SDK is preinstalled on GitHub ubuntu runners
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:assembleDebug :wearApp:assembleDebug --stacktrace

  apple:
    name: Compile Apple targets (iOS + watchOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: >
          ./gradlew
          :core:compileKotlinIosSimulatorArm64
          :core:compileKotlinWatchosSimulatorArm64
          :composeApp:compileKotlinIosSimulatorArm64
          --stacktrace

  swift-apps:
    name: Build Swift apps (iOS + watchOS)
    # macOS 15 ships Xcode 16, which reads XcodeGen's project format (objectVersion 77).
    runs-on: macos-15
    # Compose Multiplatform 1.11 hard-references an iOS-18 UIKit symbol
    # (UIViewLayoutRegion) without an @available guard, so the Swift app fails to link
    # below iOS 18. Fix: a `-Wl,-U,_OBJC_CLASS_$_UIViewLayoutRegion` linker flag in
    # iosApp/project.yml lets that one symbol resolve dynamically at runtime (CMP
    # guards it), keeping the iOS 15 floor. Remove that flag once CMP weak-links it.
    # Track: JetBrains/compose-multiplatform#4821 (CMP-10179).
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build iOS app (compiles Swift + links the KMP framework)
        working-directory: app/iosApp
        run: |
          xcodegen generate
          xcodebuild -project iosApp.xcodeproj -target iosApp \
            -configuration Debug -sdk iphonesimulator -arch arm64 \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build watchOS app (compiles Swift + links the KMP framework)
        working-directory: app/watchApp
        run: |
          xcodegen generate
          xcodebuild -project watchApp.xcodeproj -target watchApp \
            -configuration Debug -sdk watchsimulator -arch arm64 \
            CODE_SIGNING_ALLOWED=NO build
