# Generate the Xcode project with: `xcodegen generate` (run in this folder).
# Kept as a small declarative file instead of a hand-written .pbxproj.
name: iosApp
options:
  bundleIdPrefix: fyi.blep
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.blep
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # Link the Kotlin/Native framework produced by Gradle.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # -U lets this one iOS-18 UIKit symbol be missing at link time (resolved
        # dynamically at runtime). Compose Multiplatform 1.11 hard-references it
        # without an @available guard, so it'd otherwise fail to link below iOS 18;
        # CMP guards it at runtime, so the iOS 15 floor stays safe. Remove once CMP
        # weak-links it (JetBrains CMP-10179 / compose-multiplatform#4821).
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp -U _OBJC_CLASS_$_UIViewLayoutRegion"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
