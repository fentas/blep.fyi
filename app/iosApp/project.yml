# Generate the Xcode project with: `xcodegen generate` (run in this folder).
# Kept as a small declarative file instead of a hand-written .pbxproj.
name: iosApp
options:
  bundleIdPrefix: fyi.blep
  deploymentTarget:
    # Compose Multiplatform 1.11 ships a precompiled iOS binary that hard-references
    # an iOS-18 UIKit symbol (UIViewLayoutRegion), so the app only links at an iOS-18
    # floor (JetBrains/compose-multiplatform#4821). Lower this once CMP weak-links it.
    iOS: "18.0"
  createIntermediateGroups: true

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.blep
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # Link the Kotlin/Native framework produced by Gradle.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
