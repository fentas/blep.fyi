# JVM
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 ships a new Kotlin-aware DSL; opt back to the classic behaviour until the
# whole project can move to it. Investigated 2026-06 (Kotlin 2.4 / AGP 9.2.1 /
# Compose 1.11.1): `:core` migrates cleanly to `com.android.kotlin.multiplatform
# .library`, but `:composeApp` is the blocker — it's a KMP module *and* the
# Android app *and* the iOS-framework producer, and the new DSL only un-deprecates
# that combo if the app is split into a shared lib + a thin app module (which
# touches the iOS Xcode project). The new DSL is also still churning (its own
# `androidLibrary {}` block is already deprecated for `android {}`). Net: these
# stay until that split is worth doing / the tooling settles. The warnings are
# AGP-10 deprecations only — the build is green on AGP 9.
android.builtInKotlin=false
android.newDsl=false

# Compose
org.jetbrains.compose.experimental.uikit.enabled=true

# Don't fail/warn when native targets can't be built on the current host
# (e.g. Apple targets on Linux/CI ubuntu jobs).
kotlin.native.ignoreDisabledTargets=true

# ── BLEP build toggles ──────────────────────────────────────────────
# Set to false to skip Android targets/plugins when no Android SDK is
# present (e.g. running `:core:jvmTest` on a plain JVM box).
#   gradle :core:jvmTest -Pblep.android=false
blep.android=true
