# JVM
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 ships a new Kotlin-aware DSL that isn't yet compatible with the Kotlin
# Multiplatform plugin; opt back to the classic behaviour until KMP adopts the
# new `com.android.kotlin.multiplatform.library` plugin.
android.builtInKotlin=false
android.newDsl=false

# Compose
org.jetbrains.compose.experimental.uikit.enabled=true

# Don't fail/warn when native targets can't be built on the current host
# (e.g. Apple targets on Linux/CI ubuntu jobs).
kotlin.native.ignoreDisabledTargets=true

# ── BLEP build toggles ──────────────────────────────────────────────
# Set to false to skip Android targets/plugins when no Android SDK is
# present (e.g. running `:core:jvmTest` on a plain JVM box).
#   gradle :core:jvmTest -Pblep.android=false
blep.android=true
